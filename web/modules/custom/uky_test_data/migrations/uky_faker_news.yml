id: uky_faker_news
label: 'Generate test news.'
migration_group: testing

dependencies:
  enforced:
    module:
      - uky_test_data

source:
  plugin: csv
  path: 'modules/custom/uky_test_data/data/dummy.csv'
  ids: [ id ]
  header_offset: 0
  fields:
    0:
      name: id
      label: 'ID'

process:
  title:
    -
      plugin: faker
      generator: words
      args:
        - 2
      faker_locale: 'en_US'
    -
      plugin: concat
      delimiter: ' '
    -
      plugin: callback
      callable: ucwords
  body/value:
    -
      plugin: faker
      generator: words
      args:
        - 20
      faker_locale: 'en_US'
    -
      plugin: concat
      delimiter: ' '
    -
      plugin: callback
      callable: ucwords  

  field_byline:
    -
      plugin: faker
      generator: words
      args:
        - 4
      faker_locale: 'en_US'
    -
      plugin: concat
      delimiter: ' '
    -
      plugin: callback
      callable: ucwords

  field_categories:
    plugin: generate_category_reference 

  field_media:
    plugin: generate_media

  field_headline_group:
    plugin: generate_headline_group

  field_header_style:
    plugin: generate_header_style 

  field_paragraphs:
    plugin: generate_paragraph    
    
destination:
  plugin: 'entity:node'
  default_bundle: news